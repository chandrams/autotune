# Quarkus core configuration for Kruize POC
quarkus.http.port=${AUTOTUNE_SERVER_PORT:8080}

# Database Configurations
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${database_username:${DB_USER:postgres}}
quarkus.datasource.password=${database_password:${DB_PASSWORD:postgres}}
quarkus.datasource.jdbc.url=jdbc:postgresql://${database_hostname:${DB_HOST:localhost}}:${database_port:${DB_PORT:5432}}/${database_name:${DB_NAME:postgres}}

# Database Migration (Flyway)
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=112
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/rm,db/migration/lm

# Hibernate Config
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.mapping.format.global=ignore

# OpenTelemetry (Disabled for migration as per ADR)
quarkus.otel.sdk.disabled=true

# Micrometer Metrics Endpoint Redirect to /metrics (parities legacy Jetty scrapers)
quarkus.micrometer.export.prometheus.path=/metrics

# Environment variables mappings for KruizeConfig Typesafe ConfigMapping
kruize.database.username=${database_username:postgres}
kruize.database.password=${database_password:postgres}
kruize.database.hostname=${database_hostname:localhost}
kruize.database.dbname=${database_name:postgres}
kruize.database.port=${database_port:5432}
kruize.database.sslmode=${database_sslmode:disable}

kruize.settings.db.driver=${dbdriver:org.postgresql.Driver}
kruize.settings.hibernate.dialect=${hibernate_dialect:org.hibernate.dialect.PostgreSQLDialect}
kruize.settings.hibernate.connection.driver.class=${hibernate_driver:org.postgresql.Driver}
kruize.settings.hibernate.hbm2ddl.auto=${hibernate_hbm2ddlauto:none}
kruize.settings.hibernate.show.sql=${hibernate_showsql:false}
kruize.settings.hibernate.time.zone=${hibernate_timezone:UTC}
kruize.settings.save.to.db=${savetodb:false}

kruize.autotune.mode=${autotunemode:normal}
kruize.monitoring.agent=${monitoringagent:prometheus}
kruize.monitoring.service=${monitoringservice:prometheus-k8s}
kruize.monitoring.agent.endpoint=${monitoringendpoint:}

kruize.cluster.type=${clustertype:kubernetes}
kruize.k8s.type=${k8stype:minikube}
kruize.auth.type=${authtype:none}
kruize.auth.token=${authtoken:}
kruize.plots=${plots:true}
kruize.log.recommendation.metrics.level=${log_recommendation_metrics_level:error|critical}

kruize.local=${local:false}
kruize.is.ros.enabled=${isROSEnabled:true}
kruize.bulk.update.results.limit=${bulkresultslimit:100}
kruize.bulk.api.limit=${bulkapilimit:1000}
kruize.bulk.thread.pool.size=${bulkThreadPoolSize:3}
kruize.generate.recommendations.date.range.limit.in.days=${generate_recommendations_date_range_limit_in_days:15}
kruize.delete.partition.threshold.in.days=${deletepartitionsthreshold:15}
kruize.experiment.name.format=${experimentNameFormat:%datasource%|%clustername%|%namespace%|%workloadname%(%workloadtype%)|%containername%}
kruize.namespace.experiment.name.format=${namespaceExperimentNameFormat:%datasource%|%clustername%|%namespace%}

kruize.is.kafka.enabled=${isKafkaEnabled:false}
kruize.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:}
kruize.bulk.input.topic=${BULK_INPUT_TOPIC:}
kruize.kafka.consumer.group.id=${KAFKA_CONSUMER_GROUP_ID:}
kruize.kafka.topics=${KAFKA_TOPICS:}
kruize.kafka.response.filter.include=${KAFKA_RESPONSE_FILTER_INCLUDE:}
kruize.kafka.response.filter.exclude=${KAFKA_RESPONSE_FILTER_EXCLUDE:}
kruize.kafka.thread.pool.size=${kafka_thread_pool_size:3}

kruize.cloudwatch.logs.access.key.id=${logging_cloudwatch_accessKeyId:}
kruize.cloudwatch.logs.secret.access.key=${logging_cloudwatch_secretAccessKey:}
kruize.cloudwatch.logs.log.group=${logging_cloudwatch_logGroup:}
kruize.cloudwatch.logs.region=${logging_cloudwatch_region:}
kruize.cloudwatch.logs.log.stream=${logging_cloudwatch_logStream:}
kruize.cloudwatch.logs.log.level=${logging_cloudwatch_logLevel:}

# CORS configuration — matches KruizeCORSFilter (CrossOriginFilter) settings exactly.
# Allowed methods: POST, GET (KruizeConstants.CORSConstants.ALLOWED_METHODS)
# Allowed headers: KruizeConstants.CORSConstants.ALLOWED_HEADERS
# Max-age:         KruizeConstants.CORSConstants.MAX_AGE (1728000 seconds = 20 days)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=X-PINGOTHER,Origin,X-Requested-With,Content-Type,Accept
quarkus.http.cors.access-control-max-age=1728000S

# Host-header validation (3.38 note)
# When running behind a reverse proxy, disable localhost-only enforcement and
# enumerate allowed Host values.  Override in production via env-var or profile.
quarkus.http.host-validation.require-localhost=false
# quarkus.http.host-validation.allowed-hosts=my-kruize.example.com
